; PlatformIO projekt – zdrojáky jsou ve složce firmware/ (kvůli kompatibilitě s Arduino IDE)
[platformio]
src_dir = firmware

[env:esp32c3]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
; 2 aplikační oddíly po 1,9 MB (nutné pro OTA)
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
; verzi firmware nastavuje CI z git tagu přes PLATFORMIO_BUILD_FLAGS='-DFW_VERSION=\"v1.2.3\"'
lib_deps =
  lovyan03/LovyanGFX@1.2.7
  bblanchon/ArduinoJson@7.2.1
  https://github.com/bitbank2/PNGdec.git#1.1.7
