name: Firmware

# Každý push / PR: kontrolní build.
# Nová verze: změň soubor VERSION (např. 0.2.0) a pushni do main – workflow
# vytvoří tag v0.2.0 a GitHub Release s firmware.bin (pro OTA)
# a firmware-full.bin (pro první nahrání přes USB na adresu 0x0).
# Funguje i ruční push tagu vX.Y.Z.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Instalace PlatformIO
        run: pip install platformio esptool

      - name: Verze
        id: ver
        run: |
          REL=0
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="$GITHUB_REF_NAME"; REL=1
          else
            FILE_VER="v$(tr -d ' \r\n' < VERSION)"
            if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]] && \
               ! git ls-remote --exit-code --tags origin "refs/tags/$FILE_VER" >/dev/null; then
              VER="$FILE_VER"; REL=1   # nová verze v souboru VERSION -> release
            else
              VER="dev-${GITHUB_SHA::7}"
            fi
          fi
          echo "Verze: $VER (release: $REL)"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "release=$REL" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          export PLATFORMIO_BUILD_FLAGS="-DFW_VERSION=\\\"$VER\\\""
          pio run -e esp32c3

      - name: Sestavení výstupů
        run: |
          B=.pio/build/esp32c3
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -1)
          mkdir dist
          cp $B/firmware.bin dist/firmware.bin
          python -m esptool --chip esp32c3 merge_bin -o dist/firmware-full.bin \
            --flash_mode dio --flash_size 4MB \
            0x0 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 "$BOOT_APP0" 0x10000 $B/firmware.bin
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/*

      - name: GitHub Release
        if: steps.ver.outputs.release == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
